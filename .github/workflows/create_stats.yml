name: Create Github Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Debug repository GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -f query='
              query($username: String!) {
                user(login: $username) {
                  repositories(
                    first: 50
                    ownerAffiliations: OWNER
                    orderBy: {direction: DESC, field: STARGAZERS}
                  ) {
                    totalCount
                    nodes {
                      name
                      stargazerCount
                    }
                  }
                }
              }' \
            -F username="$USERNAME"

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=onedark
          path: profile/stats_dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default
          path: profile/stats_light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark trophy card
        uses: soulteary/github-profile-trophy-action@v1.2.1
        with:
          options: username=${{ github.repository_owner }}&row=3&column=5&theme=onedark
          path: profile/trophy_dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light trophy card
        uses: soulteary/github-profile-trophy-action@v1.2.1
        with:
          options: username=${{ github.repository_owner }}&row=3&column=5&theme=default
          path: profile/trophy_light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update Github Stats" || exit 0
          git push
